# Ambiente local completo. Um docker compose up sobe o banco, a autenticacao, a API REST do
# Supabase, o backend e o frontend, e aplica as migrations sozinho. Nada precisa ser configurado.
#
# Os segredos abaixo existem so para este ambiente. Nao reaproveite em lugar nenhum.

name: controle-financas

x-local:
  jwt-secret: &jwt-secret controle-financas-local-jwt-secret-nao-use-em-producao
  anon-key: &anon-key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1sb2NhbCIsImlhdCI6MTc5MDU1MzYwMCwiZXhwIjo0MTAyNDQ0ODAwLCJyb2xlIjoiYW5vbiJ9.ZTedFH81aZ2a3O_wDNK2DbFkLIZe9AHLPJvSRq7TF3Q
  service-role-key: &service-role-key eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1sb2NhbCIsImlhdCI6MTc5MDU1MzYwMCwiZXhwIjo0MTAyNDQ0ODAwLCJyb2xlIjoic2VydmljZV9yb2xlIn0.uSnDvSoYEL1Dp-R86otp552LfOtlLOqfL2pUbCWg-O4
  db-password: &db-password postgres-local

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      PGPORT: 5432
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      POSTGRES_PASSWORD: *db-password
      PGPASSWORD: *db-password
      JWT_EXP: 3600
    ports:
      # Exposta para inspecionar os dados com psql ou qualquer cliente Postgres
      - "127.0.0.1:${DB_PORT:-54322}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
      - ./docker/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:${GATEWAY_PORT:-54321}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres-local@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:${FRONTEND_PORT:-3000}
      GOTRUE_URI_ALLOW_LIST: http://localhost:${FRONTEND_PORT:-3000}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: *jwt-secret
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # A confirmacao de e-mail e os envios ficam a cargo do backend, nunca do GoTrue
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Roda depois do GoTrue porque o schema referencia auth.users e funcoes que ele cria
  migrate:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: *db-password
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./docker/migrate.sh:/migrate.sh:ro
    entrypoint: ["sh", "/migrate.sh"]
    restart: "no"

  rest:
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres-local@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_MAX_ROWS: 1000
      PGRST_JWT_SECRET: *jwt-secret
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: 3600
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_ADMIN_SERVER_PORT: 3001
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    image: nginx:1.29-alpine
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
    ports:
      # Publicado para o modo de desenvolvimento, em que o backend roda fora do Docker
      - "127.0.0.1:${GATEWAY_PORT:-54321}:8000"
    volumes:
      - ./docker/gateway.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    environment:
      PORT: 4000
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-3000}
      APP_BASE_URL: http://localhost:${FRONTEND_PORT:-3000}
      COOKIE_SECRET: segredo-de-cookie-do-ambiente-local
      COOKIE_DOMAIN: ""
      SUPABASE_URL: http://gateway:8000
      SUPABASE_ANON_KEY: *anon-key
      SUPABASE_SERVICE_ROLE_KEY: *service-role-key
      # Opcional. Sem chave, os e-mails de convite e senha aparecem no log do backend
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: "${RESEND_FROM_EMAIL:-Controle Finanças <no-reply@localhost>}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        # Embutida no bundle no build, entao mudar a porta do backend exige rebuild do frontend
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-4000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"

volumes:
  db-data:
  db-config:
