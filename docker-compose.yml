# Sobe a aplicacao, backend e frontend, conectada ao Supabase hospedado.
#
# As credenciais saem de backend/.env, o mesmo arquivo usado para rodar fora do Docker. Sem esse
# arquivo, ou sem SUPABASE_URL nele, use ./compose.sh, que acrescenta o docker-compose.local.yml
# e sobe Postgres, GoTrue e PostgREST em containers no lugar do servico hospedado.

name: controle-financas

services:
  backend:
    build: ./backend
    restart: unless-stopped
    # Nao existe num clone limpo, por isso opcional. Traz SUPABASE_URL, as duas chaves e o Resend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Dentro do container a porta e sempre 4000, muda so a publicada no host
      PORT: 4000
      # Estes quatro descrevem onde o app esta publicado, e quem sabe disso e o compose, nao o
      # backend/.env, que serve ao backend rodando direto na maquina
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${FRONTEND_PORT:-3000}}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:${FRONTEND_PORT:-3000}}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        # Embutida no bundle no build, entao mudar a porta do backend exige rebuild do frontend
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_PORT:-4000}}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
