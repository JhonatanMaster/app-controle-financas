# Expoe autenticacao e API REST no mesmo formato de caminho do Supabase hospedado, que e o
# que o supabase-js espera. Faz o papel do gateway oficial, sem a checagem de chave, que no
# ambiente local nao protege nada.

server {
  listen 8000;

  client_max_body_size 5m;

  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /health {
    return 200 "ok";
  }
}
